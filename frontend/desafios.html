<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExplAIner | Desafios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <header class="cabecalho">
      <div class="marca"><span class="logo">E</span><div><h1>ExplAIner</h1><p>Gerenciar desafios</p></div></div>
      <nav class="menu-navegacao" aria-label="Navegação principal">
        <a class="link-navegacao" href="index.html">Cadastro</a><a class="link-navegacao" href="ler.html">Ler</a>
        <a class="link-navegacao" href="listar.html">Listar</a><a class="link-navegacao" href="atualizar.html">Atualizar</a>
        <a class="link-navegacao" href="deletar.html">Deletar</a><a class="link-navegacao" href="temas.html">Temas</a>
        <a class="link-navegacao ativo" href="desafios.html">Desafios</a><a class="link-navegacao" href="questoes.html">Questões</a>
        <a class="link-navegacao" href="ranking.html">Ranking</a>
      </nav>
    </header>

    <main class="conteudo"><section class="cartao">
      <div class="titulo-cartao"><h2>Desafios</h2><p>Gerencie dificuldade, pontuação e quantidade de questões.</p></div>
      <form class="grade-formulario" id="form-desafio">
        <label class="campo"><span>Nome</span><input name="nome" required></label>
        <label class="campo"><span>Dificuldade</span><input name="dificuldade" required></label>
        <label class="campo"><span>Pontuação</span><input name="pontuacao" type="number" min="0" required></label>
        <label class="campo"><span>Quantidade de questões</span><input name="quantidade_questoes" type="number" min="1"></label>
        <button type="submit">Cadastrar desafio</button>
      </form>
      <div class="resultado" id="mensagem-desafio" hidden></div>
      <hr class="separador">
      <form class="grade-formulario" id="form-desafio-atualizar">
        <label class="campo"><span>ID</span><input id="desafio-id-atualizar" type="number" min="1" required></label>
        <label class="campo"><span>Novo nome</span><input id="desafio-nome-atualizar"></label>
        <label class="campo"><span>Nova dificuldade</span><input id="desafio-dificuldade-atualizar"></label>
        <label class="campo"><span>Nova pontuação</span><input id="desafio-pontuacao-atualizar" type="number" min="0"></label>
        <label class="campo campo-longo"><span>Nova quantidade</span><input id="desafio-quantidade-atualizar" type="number" min="1"></label>
        <button type="submit">Atualizar desafio</button>
      </form>
      <div class="resultado" id="mensagem-desafio-atualizar" hidden></div>
      <hr class="separador">
      <form class="grade-formulario" id="form-desafio-deletar">
        <label class="campo campo-longo"><span>ID para excluir</span><input id="desafio-id-deletar" type="number" min="1" required></label>
        <button class="botao-perigo" type="submit">Excluir desafio</button>
      </form>
      <div class="resultado" id="mensagem-desafio-deletar" hidden></div>
      <div class="tabela-wrapper"><table><thead><tr><th>ID</th><th>Nome</th><th>Dificuldade</th><th>Pontos</th><th>Questões</th></tr></thead><tbody id="lista-desafios"></tbody></table></div>
    </section></main>
  </div>
  <script src="common.js"></script>
  <script src="desafios.js"></script>
</body>
</html>
