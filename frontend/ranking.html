<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ExplAIner | Ranking</title><link rel="stylesheet" href="style.css"></head><body><div class="pagina"><header class="cabecalho"><div class="marca"><span class="logo">E</span><div><h1>ExplAIner</h1><p>Ranking</p></div></div><nav class="menu-navegacao" aria-label="Navegação principal"><a class="link-navegacao" href="index.html">Cadastro</a><a class="link-navegacao" href="ler.html">Ler</a><a class="link-navegacao" href="listar.html">Listar</a><a class="link-navegacao" href="atualizar.html">Atualizar</a><a class="link-navegacao" href="deletar.html">Deletar</a><a class="link-navegacao" href="temas.html">Temas</a><a class="link-navegacao" href="desafios.html">Desafios</a><a class="link-navegacao" href="questoes.html">Questões</a><a class="link-navegacao ativo" href="ranking.html">Ranking</a></nav></header><main class="conteudo"><section class="cartao"><div class="titulo-cartao"><h2>Ranking</h2><p>Gerencie registros e consulte a classificação consolidada dos alunos.</p></div><form class="grade-formulario" id="form-ranking"><label class="campo"><span>Classificação</span><input name="classificacao" type="number" min="1" required></label><label class="campo"><span>Pontos</span><input name="pontos" type="number" min="0" required></label><label class="campo campo-longo"><span>ID do aluno</span><input name="id_aluno" type="number" min="1" required></label><button type="submit">Cadastrar ranking</button></form><div class="resultado" id="mensagem-ranking" hidden></div><hr class="separador"><form class="grade-formulario" id="form-ranking-atualizar"><label class="campo"><span>ID do ranking</span><input id="ranking-id-atualizar" type="number" min="1" required></label><label class="campo"><span>Nova classificação</span><input id="ranking-classificacao-atualizar" type="number" min="1"></label><label class="campo"><span>Novos pontos</span><input id="ranking-pontos-atualizar" type="number" min="0"></label><label class="campo"><span>Novo ID do aluno</span><input id="ranking-aluno-atualizar" type="number" min="1"></label><button type="submit">Atualizar ranking</button></form><div class="resultado" id="mensagem-ranking-atualizar" hidden></div><hr class="separador"><form class="grade-formulario" id="form-ranking-deletar"><label class="campo campo-longo"><span>ID para excluir</span><input id="ranking-id-deletar" type="number" min="1" required></label><button class="botao-perigo" type="submit">Excluir ranking</button></form><div class="resultado" id="mensagem-ranking-deletar" hidden></div><h3 style="margin-top:24px">Classificação consolidada</h3><div class="tabela-wrapper"><table><thead><tr><th>Posição</th><th>Aluno</th><th>Pontos</th></tr></thead><tbody id="lista-ranking-alunos"></tbody></table></div><h3 style="margin-top:24px">Registros de ranking</h3><div class="tabela-wrapper"><table><thead><tr><th>ID</th><th>Classificação</th><th>Pontos</th><th>Aluno</th></tr></thead><tbody id="lista-ranking"></tbody></table></div></section></main></div><script src="common.js"></script><script src="ranking.js"></script></body></html>
