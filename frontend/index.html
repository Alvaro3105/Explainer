<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExplAIner | Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina">
  <header class="cabecalho">
    <div class="marca"><span class="logo">E</span><div><h1>ExplAIner</h1><p>Gamificação educacional</p></div></div>
    <nav class="menu-navegacao" aria-label="Navegação principal">
      <a class="link-navegacao ativo" href="index.html">Cadastro</a><a class="link-navegacao" href="ler.html">Ler</a><a class="link-navegacao" href="listar.html">Listar</a><a class="link-navegacao" href="atualizar.html">Atualizar</a><a class="link-navegacao" href="deletar.html">Deletar</a><a class="link-navegacao" href="temas.html">Temas</a><a class="link-navegacao" href="desafios.html">Desafios</a><a class="link-navegacao" href="questoes.html">Questões</a><a class="link-navegacao" href="ranking.html">Ranking</a>
    </nav>
  </header>
  <main class="conteudo">
    <section class="cartao">
      <div class="intro-bloco"><p class="intro-kicker">Alunos</p><p class="intro-text">Cadastre um estudante para utilizar os recursos de gamificação.</p></div>
      <div class="titulo-cartao"><h2>Novo aluno</h2><p>Preencha os dados abaixo.</p></div>
      <form class="grade-formulario" id="form-cadastro">
        <label class="campo"><span>Nome completo</span><input name="nome" type="text" required></label>
        <label class="campo"><span>E-mail</span><input name="email" type="email" required></label>
        <label class="campo"><span>Senha</span><input name="senha" type="password" minlength="6" required></label>
        <label class="campo"><span>Data de nascimento</span><input name="data_nascimento" type="date" required></label>
        <button id="btn-enviar" type="submit">Cadastrar</button>
      </form>
      <div class="resultado" id="mensagem-resposta" hidden aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="common.js"></script><script src="script.js"></script>
</body>
</html>
